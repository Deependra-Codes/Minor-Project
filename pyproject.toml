[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-fs"
version = "0.1.0"
description = "Intrusion detection on UNSW-NB15: feature selection + classic ML on the official split"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.4", "matplotlib", "xgboost>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["ids"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
